<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCM - Acesso</title>
    <link rel="stylesheet" href="visitante.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class = "pagina">

        <!--Cabeçalho-->
        <header class="cabecalho">

            <button class="botao-voltar" aria-label="Voltar">
                <span></span>
            </button>

            <div class="logo">
                <img src="img/download.png" alt="Logo MCM">
            </div>


        </header>

        <!--Opções de acesso-->
        <section class="opcoes">

            <!--Visitante-->
            <div class="card">
                <h2>Visitante</h2>
                <p>Para quem deseja apenas visualizar os projetos e votar</p>

                <button class="btn-entrar">Entrar</button>
            </div>

            <!--Aluno-->
            <div class="card">
                <h2>Aluno</h2>
                <p>Alunos com projetos</p>

                <button class="btn-entrar">Entrar</button>
            </div>

            <!--Professor-->
            <div class="card">
                <h2>Professor</h2>
                <p>Professores avaliadores</p>

                <button class="btn-entrar">Entrar</button>
            </div>

        </section>
    </main>
</body>
</html>
